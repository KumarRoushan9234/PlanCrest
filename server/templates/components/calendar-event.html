<div style="background-color: #f0f4ff; padding: 20px; border-radius: 8px; margin: 20px 0; border-left: 4px solid #667eea;">
    <h3 style="margin: 0 0 10px 0; color: #333;">{{eventTitle}}</h3>
    <p style="margin: 0 0 15px 0; color: #666; font-size: 14px;">{{eventDescription}}</p>
    <div style="display: flex; flex-wrap: wrap; gap: 15px; font-size: 13px; color: #666;">
        <span><strong>📅 Date:</strong> {{startDate}}</span>
        <span><strong>🕐 Time:</strong> {{startTime}} - {{endTime}}</span>
        {{#if location}}
        <span><strong>📍 Location:</strong> {{location}}</span>
        {{/if}}
        {{#if meetingLink}}
        <div style="width: 100%; margin-top: 10px;">
            <a href="{{meetingLink}}" style="color: #667eea; text-decoration: none;">🔗 Join Meeting</a>
        </div>
        {{/if}}
    </div>
</div>
