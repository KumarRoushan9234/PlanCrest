<div style="background-color: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0; border-left: 4px solid {{priorityColor}};">
    <h3 style="margin: 0 0 10px 0; color: #333;">{{taskTitle}}</h3>
    <p style="margin: 0 0 10px 0; color: #666; font-size: 14px;">{{taskDescription}}</p>
    <div style="display: flex; flex-wrap: wrap; gap: 15px; font-size: 13px; color: #666;">
        <span><strong>Project:</strong> {{projectName}}</span>
        <span><strong>Priority:</strong> <span style="color: {{priorityColor}};">{{priority}}</span></span>
        {{#if dueDate}}
        <span><strong>Due:</strong> {{dueDate}}</span>
        {{/if}}
        {{#if assignee}}
        <span><strong>Assigned to:</strong> {{assignee}}</span>
        {{/if}}
    </div>
</div>
