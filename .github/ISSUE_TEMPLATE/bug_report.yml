name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. Drag a task to Done
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main @ abc1234
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options: [Web app, API / server, Docker setup, Integrations, AI Mode, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets, tokens or personal data first.
      render: shell
