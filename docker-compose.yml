services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      DATABASE: mongodb://mongo:27017/plancrest
      CLIENT_URL: http://localhost:8080
      API_PUBLIC_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:8000/api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
